name: VPN Gate Node Check

on:
  schedule:
    - cron: "3,33 * * * *" 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run checker
        run: python vpngate.py
        env:
          CHECK_WORKER: "https://check.socks5.cmliussss.net/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "16"
          CHECK_TIMEOUT: "60"

      - name: Repack nodes.txt (my hosts + fastest SG/JP)
        run: python sg_pack.py
        env:
          HOSTS_URL: "https://raw.githubusercontent.com/meishero/cf-bestip/main/best_ip_yidong.txt"
          PREFER_COUNTRIES: "SG,JP"
          TOP_N: "1"
          MAX_HOSTS: "200"  #最大条目数 超过截断
          NAME_INDEX: "0"  #备注是否带 -01 序号，1=带，0=不带 (默认 0)
          SELF_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
          STICKY: "1"
          SLOW_RATIO: "2"
          SLOW_MIN_DIFF: "250"
          
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deployment
